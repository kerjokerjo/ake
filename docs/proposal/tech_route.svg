  <text x="230" y="172" text-anchor="middle" font-size="12" fill="#37474F">教学设计 / 教学反思 / 作业设计</text>

  <rect x="400" y="125" width="300" height="60" rx="8" ry="8" fill="#FFFFFF" stroke="#455A64" stroke-width="1.3"/>
  <text x="550" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">MP4 微格教学视频</text>
  <text x="550" y="172" text-anchor="middle" font-size="12" fill="#37474F">教师行为 / 语音 / 板书与 PPT 画面</text>

  <rect x="720" y="125" width="300" height="60" rx="8" ry="8" fill="#FFFFFF" stroke="#455A64" stroke-width="1.3"/>
  <text x="870" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">多专家评分</text>
  <text x="870" y="172" text-anchor="middle" font-size="12" fill="#37474F">等级制 / 分数制 · 多对多评审配置</text>

  <rect x="1040" y="125" width="380" height="60" rx="8" ry="8" fill="#FFFFFF" stroke="#455A64" stroke-width="1.3"/>
  <text x="1230" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#263238">专家评审意见 + 指标体系</text>
  <text x="1230" y="172" text-anchor="middle" font-size="12" fill="#37474F">自由文本意见 · 一/二级指标 · 材料-指标多对多</text>

  <line x1="230" y1="200" x2="230" y2="230" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="200" x2="550" y2="230" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="870" y1="200" x2="870" y2="410" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  <line x1="1230" y1="200" x2="1230" y2="410" stroke="#37474F" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5,3"/>

  <rect x="40" y="230" width="900" height="170" rx="12" ry="12" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <rect x="40" y="230" width="140" height="30" rx="12" ry="12" fill="url(#gradPerception)"/>
  <text x="110" y="251" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">感知层 · 研究内容一</text>
  <text x="190" y="251" font-size="13" font-weight="bold" fill="#0D47A1">面向教育教学举证材料的多模态语义理解与结构化表征</text>

  <rect x="70" y="275" width="240" height="105" rx="8" ry="8" fill="#FFFFFF" stroke="#1976D2" stroke-width="1.3"/>
  <text x="190" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D47A1">PDF 版面解析与教学要素抽取</text>
  <text x="190" y="320" text-anchor="middle" font-size="12" fill="#1565C0">· 教学目标 / 重难点 / 策略</text>
  <text x="190" y="338" text-anchor="middle" font-size="12" fill="#1565C0">· 学情分析 / 板书与评价设计</text>
  <text x="190" y="360" text-anchor="middle" font-size="11" fill="#546E7A">实体词典 + 抽取模型</text>

  <rect x="330" y="275" width="260" height="105" rx="8" ry="8" fill="#FFFFFF" stroke="#1976D2" stroke-width="1.3"/>
  <text x="460" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D47A1">微格视频三路融合解析</text>
  <text x="460" y="320" text-anchor="middle" font-size="12" fill="#1565C0">· 行为识别(SlowFast/ViViT)</text>
  <text x="460" y="338" text-anchor="middle" font-size="12" fill="#1565C0">· 语音转写(Whisper)</text>
  <text x="460" y="360" text-anchor="middle" font-size="12" fill="#1565C0">· 板书/PPT 画面理解</text>

  <rect x="610" y="275" width="310" height="105" rx="8" ry="8" fill="#FFFFFF" stroke="#1976D2" stroke-width="1.3"/>
  <text x="765" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D47A1">教育领域多模态大模型适配</text>
  <text x="765" y="320" text-anchor="middle" font-size="12" fill="#1565C0">基座:Qwen-VL / LLaVA / BLIP-2</text>
  <text x="765" y="338" text-anchor="middle" font-size="12" fill="#1565C0">微调:LoRA / QLoRA + 指令对齐</text>
  <text x="765" y="360" text-anchor="middle" font-size="12" fill="#1565C0">输出:结构化教学特征向量</text>

  <line x1="310" y1="325" x2="330" y2="325" stroke="#1976D2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="325" x2="610" y2="325" stroke="#1976D2" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="490" y1="400" x2="490" y2="435" stroke="#37474F" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="510" y="422" font-size="12" fill="#263238">结构化教学特征</text>

  <rect x="40" y="435" width="1420" height="200" rx="12" ry="12" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2"/>
  <rect x="40" y="435" width="140" height="30" rx="12" ry="12" fill="url(#gradCognition)"/>
  <text x="110" y="456" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">认知层 · 研究内容二</text>
  <text x="190" y="456" font-size="13" font-weight="bold" fill="#4A148C">基于异构图与证据理论的师范生能力画像建模</text>

  <rect x="70" y="480" width="320" height="140" rx="8" ry="8" fill="#FFFFFF" stroke="#7B1FA2" stroke-width="1.3"/>
  <text x="230" y="505" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A148C">五元异构信息图构建</text>
  <text x="230" y="528" text-anchor="middle" font-size="12" fill="#6A1B9A">节点:学生 / 举证材料 / 指标 /</text>
  <text x="230" y="546" text-anchor="middle" font-size="12" fill="#6A1B9A">      专家 / 评分·意见</text>
  <text x="230" y="569" text-anchor="middle" font-size="12" fill="#6A1B9A">边:材料-指标多对多、专家评审</text>
  <text x="230" y="592" text-anchor="middle" font-size="11" fill="#546E7A">直接复用已有系统业务关系</text>

  <rect x="410" y="480" width="310" height="140" rx="8" ry="8" fill="#FFFFFF" stroke="#7B1FA2" stroke-width="1.3"/>
  <text x="565" y="505" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A148C">异构图注意力网络表征学习</text>
  <text x="565" y="528" text-anchor="middle" font-size="12" fill="#6A1B9A">HAN / MAGNN / R-GCN</text>
  <text x="565" y="551" text-anchor="middle" font-size="12" fill="#6A1B9A">多源特征跨类型传播</text>
  <text x="565" y="575" text-anchor="middle" font-size="12" fill="#6A1B9A">学生节点最终表征</text>
  <text x="565" y="598" text-anchor="middle" font-size="11" fill="#546E7A">聚合材料语义 + 分数 + 意见</text>

  <rect x="740" y="480" width="320" height="140" rx="8" ry="8" fill="#FFFFFF" stroke="#7B1FA2" stroke-width="1.3"/>
  <text x="900" y="505" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A148C">D-S 证据融合 + 方面级情感分析</text>
  <text x="900" y="528" text-anchor="middle" font-size="12" fill="#6A1B9A">Dempster-Shafer 证据理论</text>
  <text x="900" y="551" text-anchor="middle" font-size="12" fill="#6A1B9A">量化多专家一致性 / 冲突度</text>
  <text x="900" y="575" text-anchor="middle" font-size="12" fill="#6A1B9A">ABSA 抽取意见细粒度观点</text>
  <text x="900" y="598" text-anchor="middle" font-size="11" fill="#546E7A">映射至具体指标维度</text>

  <rect x="1080" y="480" width="360" height="140" rx="8" ry="8" fill="#FFFFFF" stroke="#7B1FA2" stroke-width="1.3"/>
  <text x="1260" y="505" text-anchor="middle" font-size="13" font-weight="bold" fill="#4A148C">多维能力画像(含置信度)</text>
  <text x="1260" y="528" text-anchor="middle" font-size="12" fill="#6A1B9A">教学设计 / 课堂实施 / 信息化融合</text>
  <text x="1260" y="551" text-anchor="middle" font-size="12" fill="#6A1B9A">教学反思 / 教育情怀等</text>
  <text x="1260" y="575" text-anchor="middle" font-size="12" fill="#6A1B9A">"主张值 + 置信度" 可解释画像</text>
  <text x="1260" y="598" text-anchor="middle" font-size="11" fill="#546E7A">Kappa >= 0.75 · 与专家相关 >= 0.80</text>

