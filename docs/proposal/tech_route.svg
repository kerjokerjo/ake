  <line x1="720" y1="550" x2="740" y2="550" stroke="#7B1FA2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1060" y1="550" x2="1080" y2="550" stroke="#7B1FA2" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="750" y1="635" x2="750" y2="670" stroke="#37474F" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="770" y="657" font-size="12" fill="#263238">多维能力画像向量</text>

  <rect x="40" y="670" width="1420" height="210" rx="12" ry="12" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
  <rect x="40" y="670" width="140" height="30" rx="12" ry="12" fill="url(#gradDecision)"/>
  <text x="110" y="691" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">决策层 · 研究内容三</text>
  <text x="190" y="691" font-size="13" font-weight="bold" fill="#BF360C">教育领域可追溯多智能体协同与可信推荐</text>

  <rect x="70" y="715" width="300" height="150" rx="8" ry="8" fill="#FFFFFF" stroke="#E65100" stroke-width="1.3"/>
  <text x="220" y="740" text-anchor="middle" font-size="13" font-weight="bold" fill="#BF360C">教育岗位能力知识图谱</text>
  <text x="220" y="763" text-anchor="middle" font-size="12" fill="#D84315">节点:学段(幼 / 小 / 中)</text>
  <text x="220" y="783" text-anchor="middle" font-size="12" fill="#D84315">      学科(语文 / 数学 / 信息科技…)</text>
  <text x="220" y="803" text-anchor="middle" font-size="12" fill="#D84315">      岗位(学科教师 / 班主任 / 教研员)</text>
  <text x="220" y="823" text-anchor="middle" font-size="12" fill="#D84315">关系:能力维度 -> 岗位需求</text>
  <text x="220" y="848" text-anchor="middle" font-size="11" fill="#546E7A">>= 3000 实体 · >= 1 万关系</text>

  <rect x="400" y="715" width="660" height="150" rx="8" ry="8" fill="#FFFFFF" stroke="#E65100" stroke-width="1.3"/>
  <text x="730" y="738" text-anchor="middle" font-size="13" font-weight="bold" fill="#BF360C">多智能体协同工作流(Planner - Executor - Reviewer)</text>

  <rect x="420" y="755" width="190" height="95" rx="6" ry="6" fill="#FFE0B2" stroke="#E65100" stroke-width="1"/>
  <text x="515" y="776" text-anchor="middle" font-size="12" font-weight="bold" fill="#BF360C">规划 Agent (Planner)</text>
  <text x="515" y="796" text-anchor="middle" font-size="11" fill="#4E342E">画像解析 + 任务分解</text>
  <text x="515" y="815" text-anchor="middle" font-size="11" fill="#4E342E">制定检索与推荐策略</text>
  <text x="515" y="836" text-anchor="middle" font-size="11" fill="#795548">(ReAct / CoT)</text>

  <rect x="635" y="755" width="190" height="95" rx="6" ry="6" fill="#FFE0B2" stroke="#E65100" stroke-width="1"/>
  <text x="730" y="776" text-anchor="middle" font-size="12" font-weight="bold" fill="#BF360C">执行 Agent (Executor)</text>
  <text x="730" y="796" text-anchor="middle" font-size="11" fill="#4E342E">RAG over 领域 KG</text>
  <text x="730" y="815" text-anchor="middle" font-size="11" fill="#4E342E">工具调用 · 候选岗位匹配</text>
  <text x="730" y="836" text-anchor="middle" font-size="11" fill="#795548">(函数调用 + 检索增强)</text>

  <rect x="850" y="755" width="190" height="95" rx="6" ry="6" fill="#FFE0B2" stroke="#E65100" stroke-width="1"/>
  <text x="945" y="776" text-anchor="middle" font-size="12" font-weight="bold" fill="#BF360C">反思 Agent (Reviewer)</text>
  <text x="945" y="796" text-anchor="middle" font-size="11" fill="#4E342E">证据完备性 / 一致性审核</text>
  <text x="945" y="815" text-anchor="middle" font-size="11" fill="#4E342E">不通过则回退重算</text>
  <text x="945" y="836" text-anchor="middle" font-size="11" fill="#795548">(Reflexion)</text>

  <line x1="610" y1="802" x2="635" y2="802" stroke="#BF360C" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="825" y1="802" x2="850" y2="802" stroke="#BF360C" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 945 755 Q 945 725 730 725 Q 515 725 515 755" stroke="#BF360C" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="730" y="722" text-anchor="middle" font-size="11" fill="#BF360C" font-style="italic">反馈 · 再规划</text>

  <line x1="370" y1="802" x2="420" y2="802" stroke="#BF360C" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1090" y="715" width="350" height="150" rx="8" ry="8" fill="#FFFFFF" stroke="#E65100" stroke-width="1.3"/>
  <text x="1265" y="740" text-anchor="middle" font-size="13" font-weight="bold" fill="#BF360C">可追溯职业发展建议</text>
  <text x="1265" y="763" text-anchor="middle" font-size="12" fill="#D84315">Top-K 岗位方向 · 附置信度</text>
  <text x="1265" y="786" text-anchor="middle" font-size="12" fill="#D84315">证据溯源:材料 + 指标 + 专家意见</text>
  <text x="1265" y="809" text-anchor="middle" font-size="12" fill="#D84315">思维链(CoT)可审计推理过程</text>
  <text x="1265" y="832" text-anchor="middle" font-size="12" fill="#D84315">人机协同修订 · 闭环再学习</text>
  <text x="1265" y="853" text-anchor="middle" font-size="11" fill="#546E7A">Top-3 命中率 >= 85% · 可追溯率 100%</text>

  <line x1="1040" y1="802" x2="1090" y2="802" stroke="#BF360C" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="750" y1="880" x2="750" y2="910" stroke="#37474F" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="770" y="900" font-size="12" fill="#263238">画像与建议 API</text>

  <rect x="40" y="910" width="1420" height="170" rx="12" ry="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <rect x="40" y="910" width="170" height="30" rx="12" ry="12" fill="url(#gradApp)"/>
  <text x="125" y="931" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">应用层 · 系统集成与试点</text>
  <text x="220" y="931" font-size="13" font-weight="bold" fill="#1B5E20">以微服务形式嵌入已研发师范生教育教学能力认定抽检系统</text>

  <rect x="70" y="960" width="320" height="100" rx="8" ry="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.3"/>
  <text x="230" y="985" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B5E20">画像智能体微服务</text>
  <text x="230" y="1008" text-anchor="middle" font-size="12" fill="#2E7D32">REST API · 独立部署 · 可扩展</text>
  <text x="230" y="1028" text-anchor="middle" font-size="12" fill="#2E7D32">与已有认定抽检系统无缝对接</text>
  <text x="230" y="1048" text-anchor="middle" font-size="11" fill="#546E7A">接口月均可用率 >= 99.5%</text>

  <rect x="410" y="960" width="450" height="100" rx="8" ry="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.3"/>
  <text x="635" y="985" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B5E20">三类角色前端页面</text>
  <text x="635" y="1008" text-anchor="middle" font-size="12" fill="#2E7D32">师范生端:个人多维画像 + Top-K 职业方向建议</text>
  <text x="635" y="1028" text-anchor="middle" font-size="12" fill="#2E7D32">学院 / 评估院端:区域能力结构热力图 + 咨询报告</text>
  <text x="635" y="1048" text-anchor="middle" font-size="12" fill="#2E7D32">评审专家端:证据链审阅 + 推荐复核修订</text>

  <rect x="880" y="960" width="560" height="100" rx="8" ry="8" fill="#FFFFFF" stroke="#2E7D32" stroke-width="1.3"/>
  <text x="1160" y="985" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B5E20">对接区域战略 · 试点推广</text>
  <text x="1160" y="1008" text-anchor="middle" font-size="12" fill="#2E7D32">首批试点协作区:江津区 · >= 3 所高校 · >= 1500 名师范生</text>
  <text x="1160" y="1028" text-anchor="middle" font-size="12" fill="#2E7D32">推广方向:渝东北三峡库区 / 渝东南武陵山区代表性区县</text>
  <text x="1160" y="1048" text-anchor="middle" font-size="12" fill="#2E7D32">服务:成渝双城经济圈 · 长江经济带 · 教育强市区县行</text>

  <rect x="40" y="1095" width="1420" height="145" rx="12" ry="12" fill="#FFEBEE" stroke="#C62828" stroke-width="2"/>
  <rect x="40" y="1095" width="170" height="30" rx="12" ry="12" fill="#C62828"/>
