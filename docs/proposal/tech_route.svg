  <text x="60" y="108" font-size="16" font-weight="bold" fill="#263238">数据源:依托申报人已研发的师范生教育教学能力认定抽检系统(真实业务 + 脱敏数据)</text>

  <rect x="80" y="125" width="300" height="60" rx="8" ry="8" fill="#FFFFFF" stroke="#455A64" stroke-width="1.3"/>
